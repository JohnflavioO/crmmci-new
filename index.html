    <script>
      /* Defensive DOM patch: swallow the React/Google-Translate "removeChild on Node" race.
         See facebook/react#11538. We ONLY intercept the exact NotFoundError where the parent
         no longer contains the child; every other call falls through unchanged. */
      (function () {
        if (typeof Node === 'undefined' || Node.prototype.__mciDomPatched) return;
        Node.prototype.__mciDomPatched = true;
        var _removeChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            if (typeof console !== 'undefined' && console.warn) {
              console.warn('[DOM] removeChild ignorado: nó não é filho deste pai (provável extensão/tradutor).');
            }
            return child;
          }
          return _removeChild.apply(this, arguments);
        };
        var _insertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (typeof console !== 'undefined' && console.warn) {
              console.warn('[DOM] insertBefore: referenceNode não é filho deste pai, usando appendChild.');
            }
            return this.appendChild(newNode);
          }
          return _insertBefore.apply(this, arguments);
        };
      })();
    </script>

  <body>
    <div id="root">
      <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f2b26;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px">
        <p style="margin:0;font-weight:700">Carregando MCI CRM...</p>
      </main>
    </div>
    <script>
      /* Apenas registra erros pré-bootstrap no console. NÃO substitui o #root —
         isso causava tela branca/erro a cada promessa rejeitada de terceiros
         (telemetria, Firebase, extensões) antes do React montar. */
      (function () {
        window.addEventListener('error', function (e) {
          try { console.warn('[Startup error]', e.message || e); } catch (_) {}
        });
        window.addEventListener('unhandledrejection', function (e) {
          try { console.warn('[Startup rejection]', (e && e.reason) || e); } catch (_) {}
        });
      })();
    </script>
    <script>
      /* Recuperação definitiva do preview Lovable: versões antigas do CRM registraram
         service workers/app-shell que podem continuar servindo bundles quebrados no
         navegador do editor. No preview, forçamos uma única limpeza por sessão e
         preservamos todos os parâmetros __lovable_* da URL. */
      (function () {
        var host = window.location.hostname;
        var isLovablePreview = host.indexOf('id-preview--') === 0 || host.indexOf('-preview--') > -1;
        if (!isLovablePreview || !('serviceWorker' in navigator)) return;

        var recoveryKey = '__mci_preview_sw_recovered_2026_06_29_01';
        try {
          if (window.sessionStorage.getItem(recoveryKey) === '1') return;
          window.sessionStorage.setItem(recoveryKey, '1');
        } catch (_) {}

        Promise.resolve()
          .then(function () {
            if (!('caches' in window)) return null;
            return caches.keys().then(function (names) {
              return Promise.allSettled(names.map(function (name) { return caches.delete(name); }));
            });
          })
          .then(function () {
            return navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function (registration) {
              return registration.update().catch(function () {}).then(function () { return registration; });
            }).catch(function () { return null; });
          })
          .then(function () { return navigator.serviceWorker.getRegistrations(); })
          .then(function (registrations) {
            return Promise.allSettled(registrations.map(function (registration) { return registration.unregister(); }));
          })
          .then(function () {
            var url = new URL(window.location.href);
            url.searchParams.set('__mci_preview_recovered', Date.now().toString());
            window.location.replace(url.toString());
          })
          .catch(function (error) {
            try { console.warn('[Preview recovery] falhou sem bloquear o app:', error); } catch (_) {}
          });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
