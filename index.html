  <body>
    <div id="root">
      <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f2b26;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px">
        <p style="margin:0;font-weight:700">Carregando MCI CRM...</p>
      </main>
    </div>
    <script>
      (function () {
        function showStartupError(error) {
          var root = document.getElementById('root');
          if (!root || root.children.length > 1) return;
          var message = error && (error.message || error.reason || error.filename) ? (error.message || error.reason || error.filename) : 'Falha ao carregar o app';
          root.innerHTML = '<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f2b26;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:24px"><section style="max-width:520px;text-align:center;display:grid;gap:14px"><h1 style="margin:0;font-size:22px">MCI CRM</h1><p style="margin:0;color:rgba(255,255,255,.76);line-height:1.45">Não foi possível iniciar o preview.</p><pre style="white-space:pre-wrap;word-break:break-word;text-align:left;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px;font-size:11px;color:#fecaca;max-height:160px;overflow:auto">' + String(message).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }) + '</pre></section></main>';
        }
        window.addEventListener('error', showStartupError, true);
        window.addEventListener('unhandledrejection', function (event) { showStartupError(event.reason || event); }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
