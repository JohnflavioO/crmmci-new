    <script>
      /* Storage guard precisa rodar antes do bundle. Em alguns navegadores o
         preview em iframe bloqueia localStorage/sessionStorage; o cliente de
         autenticação lê localStorage durante o import inicial, o que derrubava
         o bootstrap antes do React montar. */
      (function () {
        function createMemoryStorage() {
          var store = {};
          return {
            get length() { return Object.keys(store).length; },
            clear: function () { store = {}; },
            getItem: function (key) { return Object.prototype.hasOwnProperty.call(store, key) ? store[key] : null; },
            key: function (index) { return Object.keys(store)[index] || null; },
            removeItem: function (key) { delete store[key]; },
            setItem: function (key, value) { store[key] = String(value); }
          };
        }

        function ensureStorage(name) {
          try {
            var storage = window[name];
            var testKey = '__mci_storage_boot_' + Date.now();
            storage.setItem(testKey, '1');
            storage.removeItem(testKey);
          } catch (_) {
            try {
              Object.defineProperty(window, name, {
                configurable: true,
                value: createMemoryStorage()
              });
              console.warn('[Startup] ' + name + ' bloqueado; usando fallback em memória.');
            } catch (_) {}
          }
        }

        ensureStorage('localStorage');
        ensureStorage('sessionStorage');
      })();

      /* Defensive DOM patch: swallow the React/Google-Translate "removeChild on Node" race.
         See facebook/react#11538. We ONLY intercept the exact NotFoundError where the parent
         no longer contains the child; every other call falls through unchanged. */
      (function () {
        if (typeof Node === 'undefined' || Node.prototype.__mciDomPatched) return;
        Node.prototype.__mciDomPatched = true;
        var _removeChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            if (typeof console !== 'undefined' && console.warn) {
              console.warn('[DOM] removeChild ignorado: nó não é filho deste pai (provável extensão/tradutor).');
            }
            return child;
          }
          return _removeChild.apply(this, arguments);
        };
        var _insertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (typeof console !== 'undefined' && console.warn) {
              console.warn('[DOM] insertBefore: referenceNode não é filho deste pai, usando appendChild.');
            }
            return this.appendChild(newNode);
          }
          return _insertBefore.apply(this, arguments);
        };
      })();

      /* Lovable preview token guard: keep the editor authorization params on every
         same-origin SPA navigation. Without this, leaving/returning to the editor can
         reload a preview URL that the platform no longer authorizes, causing the
         browser-level "page unavailable" white screen before React can mount. */
      (function () {
        var host = window.location.hostname;
        var isPreview = window.self !== window.top
          || host.indexOf('id-preview--') === 0
          || host.indexOf('preview--') !== -1
          || /\.lovableproject(?:-dev)?\.com$/.test(host)
          || /\.beta\.lovable\.dev$/.test(host);

        if (!isPreview) return;

        var paramNames = ['__lovable_sha', '__lovable_token', '__lovable_load_id'];
        var storageKey = '__mci_lovable_preview_params';

        function readStored() {
          try { return JSON.parse(window.sessionStorage.getItem(storageKey) || '{}') || {}; }
          catch (_) { return {}; }
        }

        function writeStored(values) {
          try { window.sessionStorage.setItem(storageKey, JSON.stringify(values)); }
          catch (_) {}
        }

        function readFromSearch(search) {
          var params = new URLSearchParams(search || '');
          var values = {};
          paramNames.forEach(function (name) {
            var value = params.get(name);
            if (value) values[name] = value;
          });
          return values;
        }

        var preserved = Object.assign(readStored(), readFromSearch(window.location.search));
        writeStored(preserved);

        function mergePreviewParams(rawUrl) {
          if (!rawUrl || !Object.keys(preserved).length) return rawUrl;
          try {
            var original = String(rawUrl);
            if (/^(mailto:|tel:|javascript:|data:)/i.test(original)) return rawUrl;
            var url = new URL(original, window.location.href);
            if (url.origin !== window.location.origin) return rawUrl;

            Object.keys(preserved).forEach(function (name) {
              if (!url.searchParams.has(name) && preserved[name]) {
                url.searchParams.set(name, preserved[name]);
              }
            });

            return url.pathname + url.search + url.hash;
          } catch (_) {
            return rawUrl;
          }
        }

        if (Object.keys(preserved).length) {
          var repairedUrl = mergePreviewParams(window.location.href);
          if (repairedUrl && repairedUrl !== window.location.pathname + window.location.search + window.location.hash) {
            try { window.history.replaceState(window.history.state, '', repairedUrl); } catch (_) {}
          }
        }

        var originalPushState = window.history.pushState;
        var originalReplaceState = window.history.replaceState;
        window.history.pushState = function (state, title, url) {
          return originalPushState.call(this, state, title, url == null ? url : mergePreviewParams(url));
        };
        window.history.replaceState = function (state, title, url) {
          return originalReplaceState.call(this, state, title, url == null ? url : mergePreviewParams(url));
        };
      })();

      /* Limpeza segura: remove somente service workers antigos do app-shell MCI
         (/sw.js e /service-worker.js). Não toca no worker de push Firebase nem em
         qualquer worker da plataforma. Se um worker antigo ainda estiver controlando
         esta aba, fazemos UMA recarga controlada após unregister para sair do cache
         antigo sem criar loop branco no preview. */
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var appShellWorkerPaths = ['/sw.js', '/service-worker.js'];
        var reloadFlag = '__mci_app_shell_sw_reloaded_v3';
        var isAppShellScript = function (scriptURL) {
          try {
            var url = new URL(scriptURL);
            return url.origin === window.location.origin && appShellWorkerPaths.indexOf(url.pathname) !== -1;
          } catch (_) {
            return false;
          }
        };

        var isAppShellCache = function (name) {
          return /(^|-)precache-v\d+-|(^|-)runtime-|(^|-)googleAnalytics-/.test(name)
            && (name.indexOf(window.location.origin) !== -1 || name.indexOf(window.location.host) !== -1);
        };

        var cleanup = function () {
          var controlledByAppShell = !!(navigator.serviceWorker.controller && isAppShellScript(navigator.serviceWorker.controller.scriptURL));
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.allSettled(registrations.map(function (registration) {
              var worker = registration.active || registration.waiting || registration.installing;
              if (worker && isAppShellScript(worker.scriptURL)) {
                try { registration.update(); } catch (_) {}
                return registration.unregister();
              }
              return null;
            }));
          }).catch(function () {}).finally(function () {
            if (!controlledByAppShell) return;
            try {
              if (window.sessionStorage.getItem(reloadFlag) === '1') return;
              window.sessionStorage.setItem(reloadFlag, '1');
            } catch (_) {}
            var url = new URL(window.location.href);
            url.searchParams.set('__mci_sw_clean', '1');
            window.location.replace(url.toString());
          });

          if ('caches' in window) {
            caches.keys().then(function (names) {
              return Promise.allSettled(names.filter(isAppShellCache).map(function (name) { return caches.delete(name); }));
            }).catch(function () {});
          }
        };

        cleanup();
        window.addEventListener('load', cleanup, { once: true });
      })();
    </script>

  <body>
    <div id="root">
      <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f2b26;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px">
        <p style="margin:0;font-weight:700">Carregando MCI CRM...</p>
      </main>
    </div>
    <script>
      /* Apenas registra erros pré-bootstrap no console. NÃO substitui o #root —
         isso causava tela branca/erro a cada promessa rejeitada de terceiros
         (telemetria, Firebase, extensões) antes do React montar. */
      (function () {
        window.addEventListener('error', function (e) {
          try { console.warn('[Startup error]', e.message || e); } catch (_) {}
        });
        window.addEventListener('unhandledrejection', function (e) {
          try { console.warn('[Startup rejection]', (e && e.reason) || e); } catch (_) {}
        });

        window.setTimeout(function () {
          if (window.__mciReactMounted) return;
          var host = window.location.hostname;
          var isPreview = window.self !== window.top
            || host.indexOf('id-preview--') === 0
            || host.indexOf('preview--') !== -1
            || host.indexOf('lovable.app') !== -1
            || /\.lovableproject(?:-dev)?\.com$/.test(host)
            || /\.beta\.lovable\.dev$/.test(host);
          if (!isPreview) return;

          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f2b26;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;padding:24px"><section style="max-width:520px;text-align:center;display:grid;gap:14px"><h1 style="font-size:22px;margin:0">MCI CRM está recuperando o preview</h1><p style="margin:0;color:rgba(255,255,255,.72);font-size:14px;line-height:1.5">Detectamos cache antigo do navegador/editor. Clique para fazer uma limpeza segura sem loop de recarga.</p><button id="mci-auto-recover" style="border:0;border-radius:10px;padding:12px 14px;background:#059669;color:white;font-weight:700;cursor:pointer">Corrigir agora</button></section></main>';

          var recover = function () {
            Promise.resolve()
              .then(function () {
                if (!('serviceWorker' in navigator)) return null;
                return navigator.serviceWorker.getRegistrations().then(function (registrations) {
                  return Promise.allSettled(registrations.filter(function (registration) {
                    var worker = registration.active || registration.waiting || registration.installing;
                    if (!worker || !worker.scriptURL) return false;
                    try {
                      var workerUrl = new URL(worker.scriptURL);
                      return workerUrl.origin === window.location.origin
                        && (workerUrl.pathname === '/sw.js' || workerUrl.pathname === '/service-worker.js');
                    } catch (_) {
                      return false;
                    }
                  }).map(function (registration) { return registration.unregister(); }));
                });
              })
              .then(function () {
                if (!('caches' in window)) return null;
                return caches.keys().then(function (names) {
                  return Promise.allSettled(names.filter(function (name) {
                    return /(^|-)precache-v\d+-|(^|-)runtime-|(^|-)googleAnalytics-/.test(name);
                  }).map(function (name) { return caches.delete(name); }));
                });
              })
              .finally(function () {
                var url = new URL(window.location.href);
                url.searchParams.set('__mci_preview_recover', '1');
                window.location.replace(url.toString());
              });
          };

          document.getElementById('mci-auto-recover')?.addEventListener('click', recover);
        }, 12000);
      })();
    </script>
